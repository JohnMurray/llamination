# PostgreSQL is the source of truth; environment variables allow managed production services.
spring.datasource.url=${LLAMINATION_DATABASE_URL:jdbc:postgresql://localhost:${LLAMINATION_POSTGRES_PORT:5432}/${LLAMINATION_POSTGRES_DB:llamination}}
spring.datasource.username=${LLAMINATION_DATABASE_USER:${LLAMINATION_POSTGRES_USER:llamination}}
spring.datasource.password=${LLAMINATION_DATABASE_PASSWORD:${LLAMINATION_POSTGRES_PASSWORD:llamination}}

# Redis holds disposable HTTP sessions and can be replaced without losing canonical data.
spring.data.redis.host=${LLAMINATION_REDIS_HOST:localhost}
spring.data.redis.port=${LLAMINATION_REDIS_PORT:6379}
spring.session.store-type=redis
spring.session.redis.namespace=llamination:session

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# Preserve lobby membership briefly across refreshes and transient connection loss.
llamination.lobby.disconnect-grace=5s
