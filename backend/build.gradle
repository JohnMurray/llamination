plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'net.ltgt.errorprone' version '5.1.0'
}

group = 'com.llamination'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    errorprone 'com.google.errorprone:error_prone_core:2.50.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('frontendInstall', Exec) {
    workingDir '../frontend'
    commandLine 'npm', 'ci'
    inputs.files('../frontend/package.json', '../frontend/package-lock.json')
    outputs.dir('../frontend/node_modules')
}

tasks.register('frontendBuild', Exec) {
    dependsOn 'frontendInstall'
    workingDir '../frontend'
    commandLine 'npm', 'run', 'build'
    inputs.dir('../frontend/src')
    inputs.files('../frontend/index.html', '../frontend/tsconfig.json', '../frontend/tsconfig.app.json', '../frontend/tsconfig.node.json', '../frontend/vite.config.ts')
    outputs.dir('../frontend/dist')
}

tasks.named('processResources') {
    dependsOn 'frontendBuild'
    from('../frontend/dist') {
        into 'static'
    }
}
