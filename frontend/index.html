<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Llamination</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top, #354a3a, #121813 55%); color: #f6f1e5; }
    button, input { font: inherit; }
    .shell { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
    .card { width: min(100%, 34rem); padding: 2.5rem; border: 1px solid #ffffff20; border-radius: 1.25rem; background: #182019e8; box-shadow: 0 1.5rem 5rem #0009; }
    .eyebrow { margin: 0 0 .4rem; color: #b5cb85; font-size: .75rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(2.4rem, 10vw, 4rem); }
    .subtitle { margin: .4rem 0 2rem; color: #bac1b8; }
    label { display: block; margin: 1rem 0 .4rem; font-size: .85rem; font-weight: 700; }
    input { width: 100%; padding: .8rem .9rem; border: 1px solid #ffffff2c; border-radius: .55rem; background: #0d120e; color: inherit; outline: none; }
    input:focus { border-color: #b5cb85; box-shadow: 0 0 0 3px #b5cb8525; }
    button { width: 100%; margin-top: 1.4rem; padding: .85rem 1rem; border: 0; border-radius: .55rem; background: #b5cb85; color: #142015; font-weight: 800; cursor: pointer; }
    button:hover { background: #c5dc94; }
    button:disabled { cursor: wait; opacity: .65; }
    .error { min-height: 1.3rem; margin: .8rem 0 0; color: #ff9e94; font-size: .85rem; }
    .game { width: min(100%, 60rem); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.25rem; border: 1px solid #ffffff18; border-radius: .8rem; background: #182019e8; }
    .topbar strong { color: #b5cb85; }
    .topbar button { width: auto; margin: 0; padding: .6rem 1rem; background: transparent; color: #f6f1e5; border: 1px solid #ffffff35; }
    .world { display: grid; place-items: center; min-height: 60vh; margin-top: 1rem; border: 1px dashed #ffffff28; border-radius: 1rem; color: #9ca69b; background: #0b100ccc; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="shell">
    <section id="login-view" class="card" aria-labelledby="login-title">
      <p class="eyebrow">Cooperative RTS</p>
      <h1 id="login-title">Llamination</h1>
      <p class="subtitle">Sign in to rally your herd.</p>
      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button id="login-button" type="submit">Enter the pasture</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="game-view" class="game" hidden>
      <header class="topbar">
        <span>Signed in as <strong id="current-user"></strong></span>
        <button id="logout-button" type="button">Log out</button>
      </header>
      <div class="world">The battlefield awaits.</div>
    </section>
  </main>

  <script>
    const loginView = document.querySelector('#login-view');
    const gameView = document.querySelector('#game-view');
    const loginForm = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const loginError = document.querySelector('#login-error');
    const currentUser = document.querySelector('#current-user');

    function showSession(session) {
      loginView.hidden = session.authenticated;
      gameView.hidden = !session.authenticated;
      currentUser.textContent = session.username || '';
      if (!session.authenticated) document.querySelector('#username').focus();
    }

    async function request(url, options = {}) {
      const response = await fetch(url, {
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options
      });
      if (!response.ok) throw new Error(response.status === 401 ? 'Invalid username or password.' : 'Something went wrong. Please try again.');
      return response.status === 204 ? null : response.json();
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginError.textContent = '';
      loginButton.disabled = true;
      const data = new FormData(loginForm);
      try {
        showSession(await request('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ username: data.get('username'), password: data.get('password') })
        }));
        loginForm.reset();
      } catch (error) {
        loginError.textContent = error.message;
      } finally {
        loginButton.disabled = false;
      }
    });

    document.querySelector('#logout-button').addEventListener('click', async () => {
      try {
        await request('/api/auth/logout', { method: 'POST' });
      } finally {
        showSession({ authenticated: false, username: null });
      }
    });

    request('/api/auth/session').then(showSession).catch(() => showSession({ authenticated: false, username: null }));
  </script>
</body>
</html>
